<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>XbetcoreAdressPay</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0f0f0f, #1c1c1c);
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      text-align: center;
      padding: 60px 20px;
    }

    h1 {
      font-size: 32px;
      color: #00ffc3;
      text-shadow: 0 0 10px #00ffc3;
      animation: pulse 2s infinite alternate;
    }

    @keyframes pulse {
      from { text-shadow: 0 0 10px #00ffc3; }
      to { text-shadow: 0 0 20px #00ffc3, 0 0 30px #00ffc3; }
    }

    p {
      font-size: 18px;
      margin-bottom: 30px;
      color: #ccc;
    }

    .wallet {
      background: rgba(255, 255, 255, 0.05);
      padding: 25px;
      border-radius: 10px;
      width: 90%;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 15px #00ffc340;
    }

    .wallet strong {
      display: block;
      font-size: 20px;
      color: #00ffc3;
      margin-top: 10px;
    }

    button {
      background: linear-gradient(45deg, #ff1e56, #ff416c);
      border: none;
      color: white;
      padding: 12px 25px;
      margin-top: 20px;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
      font-size: 16px;
      transition: transform 0.2s ease-in-out, box-shadow 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 12px #ff416c99;
    }

    footer {
      margin-top: 50px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>
<body>
  <h1>🔐 Recharge Privée – 1XBETCORE</h1>
  <p>Effectue ici ta recharge confidentielle pour activer ton compte ultra-sécurisé <strong>1XBETCORE</strong>. Paiement discret, rapide et non traçable.</p>
  
  <div class="wallet">
    Adresse MEXC : 
    <strong id="wallet">bc1qexemple123456789</strong>
    <button onclick="copyWallet()">📋 Copier l'adresse</button>
  </div>

  <footer>
    Ce service est réservé aux membres premium de la plateforme Xbetcore.
  </footer>

  <script>
    function copyWallet() {
      const text = document.getElementById("wallet").innerText;
      navigator.clipboard.writeText(text);
      alert("✅ Adresse MEXC copiée dans le presse-papiers !");
    }
  </script>
</body>
</html>
